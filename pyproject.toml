[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trustmint"
version = "0.1.0"
description = "Find out who can mint a token your cloud trusts: offline auditing of OIDC workload identity federation from CI/CD and Kubernetes into AWS, Google Cloud and Azure."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ahmed Hany" }]
keywords = ["security", "oidc", "workload-identity-federation", "aws", "gcp", "azure", "github-actions", "iam"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.6", "boto3>=1.34"]

[project.scripts]
trustmint = "trustmint.cli:main"

[project.urls]
Homepage = "https://github.com/ahmedhany-cys/trustmint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trustmint = ["scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
